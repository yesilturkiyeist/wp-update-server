name: Sunucu release

# lib/server.php içindeki VERSION değişince v<sürüm> release'i ve
# wp-update-server.zip (hosting'e elle yüklenecek paket) üretilir.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zip ve release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 -oP "const VERSION = '\K[^']+" lib/server.php)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag zaten var"; exit 0
          fi
          bash bin/build-zip.sh
          gh release create "$tag" dist/wp-update-server.zip \
            --target "$GITHUB_SHA" --title "wp-update-server $version" \
            --notes "Hosting'e yükleme: zip'i subdomain'in kök klasörüne açın, config.sample.php → config.php. Güncellemede config.php ve data/ korunur (zip'te yok)."
